name: pipePython

on: 
  push:
    branches: [main]


jobs:
  calcu:
    runs-on: ubuntu-latest

    steps: 
    - name: configurar python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: instalar dependências
      run: pip install pytest

    - name: instalar dependências
      run: pip install pytest
      
